# Collection KV Store pour matérialiser des résultats esearch. Schéma souple :
# le KV Store accepte des champs arbitraires ; les `field.*` ci-dessous ne sont
# qu'un typage indicatif, alignés sur le fields_list du lookup (transforms.conf).
# Ce qui est réellement écrit/lu dépend du fields_list — à adapter à vos données.
[esearch_cache]
field._time       = number
field.host        = string
field.ip          = string
field.mac         = string
field.dns         = string
field.nt_host     = string
field.owner       = string
field.user        = string
field.src         = string
field.dest        = string
field.status      = string
field.path        = string
field.category    = string
field.priority    = string
field.bunit       = string
field.materialise_le = number
