# ============================================================================
# TEMPLATES de matérialisation (DÉSACTIVÉS par défaut). À cloner/adapter dans
# local/ : régler le profil, la requête, le champ de clé et le cron.
# Intérêt : requêter Elasticsearch périodiquement et écrire le résultat dans
# Splunk (KV Store ou summary index) pour dashboards rapides, cache, et
# alimentation de contenu Splunk ES — sans marteler ES à chaque affichage.
# ============================================================================

# --- Variante A : KV Store (état courant / enrichissement, upsert par _key) ---
# - sort=desc + dedup : on garde le document LE PLUS RÉCENT par clé. Sans eux,
#   tous les documents d'une même clé s'écrasaient dans un ordre quelconque.
# - append=true : mise à jour par _key. Sans lui, outputlookup REMPLACE toute la
#   collection à chaque passage (vérifié).
# - materialise_le : date d'écriture, sur laquelle porte la rétention (_time est
#   la date du document Elasticsearch, souvent bien plus ancienne).
[esearch_materialize_kvstore_TEMPLATE]
disabled = 1
description = TEMPLATE - matérialise un profil esearch dans la collection KV Store esearch_cache (adapter profil/query/_key).
enableSched = 0
cron_schedule = 7 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
action.keyindicator = 0
search = | esearch profile=prod index="assets-*" query="*" limit=50000 sort=desc \
| dedup host \
| eval _key=host, materialise_le=now() \
| outputlookup append=true esearch_cache

# --- Variante B : summary index (historique / tendances) ---
# `fields - _raw` est indispensable : sinon collect écrit le JSON d'Elasticsearch
# tel quel, et à la relecture (sourcetype stash) AUCUN champ n'est extrait.
# Le `host` d'Elasticsearch devient `orig_host` (host = le search head) : en
# tenir compte pour les enrichissements par hôte (vérifié).
[esearch_materialize_summary_TEMPLATE]
disabled = 1
description = TEMPLATE - matérialise un profil esearch dans un summary index (adapter profil/query/index).
enableSched = 0
cron_schedule = 7 * * * *
dispatch.earliest_time = -1h@m
dispatch.latest_time = now
search = | esearch profile=prod index="logs-*" query="status:500" limit=50000 \
| fields - _raw \
| collect index=esearch_summary

# --- Rétention KV Store (le KV Store ne purge pas seul hors Splunk Cloud) ---
# Supprime les entrées esearch_cache NON RAFRAÎCHIES depuis 2 jours (adapter la
# fenêtre). Porte sur materialise_le, pas sur _time : filtrer sur _time (date du
# document ES) vidait la collection juste après l'avoir remplie.
[esearch_cache_retention_TEMPLATE]
disabled = 1
description = TEMPLATE - purge des entrées KV Store esearch_cache non rafraîchies depuis 2 jours.
enableSched = 0
cron_schedule = 17 2 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = now
search = | inputlookup esearch_cache | where materialise_le >= relative_time(now(), "-2d") \
| outputlookup esearch_cache
