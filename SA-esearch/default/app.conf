[install]
is_configured = 0
# OBLIGATOIRE (app.conf.spec) : force les navigateurs à recharger les fichiers
# statiques (setup.js) d'une nouvelle version. Absent jusqu'en 1.10.2 : après
# une mise à jour, la page Configuration pouvait exécuter l'ANCIEN script.
# Dérivé de la version : X.Y.Z -> X*10000 + Y*100 + Z (contrôlé par le préflight).
build = 20000

[ui]
is_visible = 1
label = esearch for Elasticsearch

[launcher]
author = aurelien-oui
version = 2.0.0
description = Query Elasticsearch from Splunk without indexing

[package]
id = SA-esearch
check_for_updates = false

[id]
name = SA-esearch
version = 2.0.0

[triggers]
reload.esearch = simple
