# Protocole SCPv2 (chunked). L'ancien SCPv1 (enableheader/supports_getinfo)
# est déprécié ; splunklib détecte automatiquement le protocole, ce qui
# permet un retour arrière en restaurant l'ancienne stanza si besoin.
[esearch]
filename = esearch.py
chunked = true
python.version = python3
python.required = 3.9,3.13

# Listing des cibles interrogeables d'un profil (index, alias, data streams).
# Alimente le menu « Index » de la page Query ; passe par le proxy REST
# privilégié, comme esearch.
[esindices]
filename = esindices.py
chunked = true
python.version = python3
python.required = 3.9,3.13

# Profils utilisables par l'utilisateur, dans l'ordre de priorité (le premier
# est son profil par défaut). Alimente le menu « Profil » de la page Query.
[esprofiles]
filename = esprofiles.py
chunked = true
python.version = python3
python.required = 3.9,3.13
