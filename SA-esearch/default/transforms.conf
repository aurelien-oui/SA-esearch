# Lookup adossé au KV Store esearch_cache (matérialisation).
# IMPORTANT : `fields_list` détermine les champs RÉELLEMENT stockés/lus. Un
# lookup KV Store l'exige. La liste ci-dessous est un EXEMPLE (champs d'actif /
# de log courants) — ADAPTER à votre schéma ES dans local/transforms.conf.
[esearch_cache]
external_type = kvstore
collection = esearch_cache
case_sensitive_match = false
fields_list = _key,_time,host,ip,mac,dns,nt_host,owner,user,src,dest,status,path,category,priority,bunit,materialise_le

# Segmentation du journal de l'app (props.conf, [esearch:log]). Règles
# disjointes : l'ordre n'a pas d'importance.
# DEBUG du niveau global : niveau DEBUG, SANS marqueur de recherche debug.
[esearch_log_debug]
REGEX = ^\S+ \S+ \[DEBUG\] \[pid=\d+\] (?!\[debug[ \]])
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::esearch:log:debug

# Recherche lancée avec debug=true : marqueur [debug …], quel que soit le niveau.
[esearch_log_debug_search]
REGEX = ^\S+ \S+ \[[A-Z]+\] \[pid=\d+\] \[debug[ \]]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::esearch:log:debug_search
