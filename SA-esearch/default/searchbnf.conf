# Aide et complétion de la barre de recherche (1.25.0) pour les trois commandes.
# Les options dépréciées (user=, password=, apikey=, compress=,
# compress_threshold=) n'y figurent pas : elles restent acceptées ou refusées
# en le disant, mais l'aide ne les propose plus. Référence complète : README.md.

[esearch-command]
syntax = esearch (<esearch-options>)*
shortdesc = Interroge Elasticsearch en direct (Lucene ou ES|QL), sans indexer.
description = Interroge Elasticsearch et rend les documents comme événements \
    Splunk, sans les indexer. Deux langages : query= (Lucene, paginé jusqu'à \
    limit=) ou esql= (ES|QL, une requête). La connexion vient d'un profil défini \
    par l'administrateur (profile=, sinon le premier profil autorisé). La période \
    est celle du sélecteur de temps, ou earliest= / latest= écrits dans la \
    commande, qui le remplacent comme dans une recherche Splunk.
usage = public
category = generating
tags = elasticsearch es esql lucene kibana
related = esindices esprofiles
example1 = | esearch profile=prod index="logs-*" query="status:500" limit=1000
comment1 = Les 1000 premiers documents en erreur 500, sur la période du sélecteur.
example2 = | esearch esql="FROM logs-* | STATS n = COUNT(*) BY host.name"
comment2 = Agrégation ES|QL, calculée par Elasticsearch, avec le profil par défaut.
example3 = | esearch index="logs-*" query="*" earliest=-1h@h latest=@h sort=desc
comment3 = La dernière heure pleine, du plus récent au plus ancien, quel que soit le sélecteur.
example4 = | esearch index="logs-*" query="*" lookup_include="hotes_suivis.csv"
comment4 = Documents dont les colonnes correspondent à une ligne de la lookup (ET sur les colonnes, OU sur les lignes).
example5 = | esearch esql="FROM logs-* METADATA _index, _id | KEEP @timestamp, message, _index, _id"
comment5 = Métadonnées ES|QL, rendues dans les champs es_index et es_id.
example6 = | esearch index="logs-*" query="user.name:alice" es_metadata=true | dedup es_id
comment6 = Index et identifiant de chaque document (es_index, es_id), pour dédoublonner.

[esearch-options]
syntax = profile=<string> | es_host=<string> | index=<string> | query=<string> \
    | esql=<string> | limit=<int> | timefield=<field> | sort=(none|asc|desc) \
    | earliest=<time-modifier> | latest=<time-modifier> | es_metadata=<bool> \
    | _source_include=<string> | _source_exclude=<string> \
    | lookup_include=<string> | lookup_exclude=<string> \
    | inclusion_type=(and|or) | exclusion_type=(and|or) \
    | lookup_fields_keep=<string> | lookup_fields_ignore=<string> \
    | lookup_mode=(lucene|terms) | lookup_stage=(source|result) \
    | retry_count=<int> | backoff_base=<num> | timeout_connect=<int> \
    | timeout_read=<int> | debug=<bool> | debug_tag=<string>
description = profile : profil de connexion défini par l'administrateur. \
    es_host : URL d'Elasticsearch en mode ad hoc (désactivé par défaut). \
    index : index, alias ou data stream, jokers admis (Lucene). \
    query : requête Lucene, "*" pour tout. esql : requête ES|QL, à la place de query. \
    limit : nombre maximal de résultats (100 par défaut, plafonné par le profil). \
    timefield : champ date qui borne la période et donne _time. \
    sort : tri sur le champ date (none par défaut). \
    earliest, latest : période écrite dans la commande (-1h@h, époque, ISO 8601, \
    MM/JJ/AAAA:HH:MM:SS), prioritaire sur le sélecteur de temps. \
    es_metadata : ajoute es_index et es_id à chaque événement (Lucene). \
    _source_include, _source_exclude : champs ramenés ou écartés (Lucene). \
    lookup_include, lookup_exclude : lookups Splunk qui filtrent les documents ; \
    inclusion_type, exclusion_type : combinaison de plusieurs lookups ; \
    lookup_fields_keep, lookup_fields_ignore : colonnes retenues ; \
    lookup_mode : lucene ou terms (valeurs exactes) ; \
    lookup_stage : avec esql, source (documents) ou result (colonnes du résultat). \
    retry_count, backoff_base, timeout_connect, timeout_read : transport. \
    debug, debug_tag : journal détaillé de cette recherche, et son étiquette.

[esindices-command]
syntax = esindices (profile=<string>)? (pattern=<string>)? (<esindices-transport>)*
shortdesc = Liste les index, alias et data streams interrogeables d'un profil.
description = Liste les cibles qu'un profil peut interroger : index, alias et \
    data streams, filtrés par pattern= (jokers admis). Sans profile=, le premier \
    profil autorisé. Alimente le menu Index de la page Query.
usage = public
category = generating
tags = elasticsearch es index
related = esearch esprofiles
example1 = | esindices profile=prod pattern="logs-*"
comment1 = Les cibles du profil prod dont le nom commence par logs-.

[esindices-transport]
syntax = retry_count=<int> | backoff_base=<num> | timeout_connect=<int> | timeout_read=<int>
description = Nouvelles tentatives et délais de connexion et de lecture.

[esprofiles-command]
syntax = esprofiles
shortdesc = Liste les profils Elasticsearch que vous pouvez utiliser.
description = Les profils autorisés pour vos rôles, dans l'ordre fixé par \
    l'administrateur : le premier est votre profil par défaut.
usage = public
category = generating
tags = elasticsearch es profil
related = esearch esindices
example1 = | esprofiles
comment1 = Vos profils, le profil par défaut en tête.
