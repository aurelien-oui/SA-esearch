# Réglages par défaut de la commande esearch.
# Surcharger dans local/esearch.conf (jamais dans default/).

[settings]
# Autoriser | esearch es_host="..." (mode ad hoc).
# Défaut durci = false : seuls les profils déclarés sont utilisables (anti-SSRF).
# Pour réactiver le mode ad hoc (environnement de test), surcharger dans local/esearch.conf :
#   [settings]
#   allow_adhoc_host = true
allow_adhoc_host = false
# PLAFOND dur du nombre d'événements par recherche (protège le search head).
# Ce n'est PAS le nombre de résultats ramenés : c'est la limite à ne jamais
# dépasser. Le nombre effectivement ramené vient de l'option limit= de la SPL,
# ou de default_limit ci-dessous pour la page Query.
max_limit = 50000
# NOMBRE de résultats proposé par défaut dans la page Query (champ « Limite »).
# C'est ce réglage qu'il faut changer pour ramener plus (ou moins) de résultats
# sans toucher à la SPL. Toujours borné par max_limit.
default_limit = 100
# Vérification TLS pour le mode ad hoc (les profils ont leur propre réglage).
verify_certs = true
# Verbosité du log $SPLUNK_HOME/var/log/splunk/esearch.log : DEBUG|INFO|WARNING
log_level = INFO
# Détection passive de version/distribution ES (GET / loggé) à CHAQUE recherche.
# Désactivé par défaut (coût d'un aller-retour/recherche) ; activer pour diagnostiquer.
detect_version = false
# Plafond serveur du timeout de lecture ES (s) appliqué par le proxy aux profils
# authentifiés (anti-abus). S'applique à UNE page, pas à la recherche entière.
max_timeout_read = 300
# Plafond (Mo) d'UNE réponse d'Elasticsearch, une fois décompressée (une page de
# recherche, une réponse ES|QL). Au-delà, la recherche échoue en le disant :
# sans plafond, un serveur hostile épuisait la mémoire (bombe de décompression).
# Un encodage chaîné (`gzip, gzip`) est refusé. Entre 1 et 4096.
max_response_mb = 256

# --- Requête Lucene (query=) --------------------------------------------------
# Bornes contrôlées AVANT envoi, par la commande et par le proxy. Mesuré sur un
# cluster de test (tas de 512 Mo) : ~3 000 niveaux de parenthèses arrêtaient un nœud
# (StackOverflowError), une phrase de 4 Mo aussi (OutOfMemoryError). Les défauts
# sont prudents ; un cluster de production plus robuste peut les relever.
# Taille en octets, de 1024 à 2147483647 ; imbrication, de 1 à 100000.
query_max_bytes = 1048576
query_max_depth = 30
# Durée de vie du contexte de pagination Elasticsearch (PIT ou scroll) entre
# deux pages. Doit couvrir un aller-retour commande <-> proxy ; à rallonger si
# le search head ou le cluster sont lents.
page_keep_alive = 2m
# Un document Elasticsearch contenant host / source / sourcetype fixe ces
# métadonnées de l'événement Splunk. C'est souvent voulu (le document décrit la
# machine d'origine), mais ce sont des champs qu'exploitent le CIM et les
# correlation searches. Passer à true pour les préfixer `es_` et garantir
# qu'Elasticsearch ne les pilote pas.
# Défaut false = comportement historique, ne change rien à l'upgrade.
sanitize_metadata_fields = false
# Colonnes de lookup jamais utilisées comme filtre par lookup_include= /
# lookup_exclude= (virgules, motifs `*` admis : commentaire, description, date_*).
# Les colonnes `_*` (internes à Splunk, `_key` du KV store) le sont toujours.
lookup_fields_ignore =
# Ce qu'écrit une recherche lancée avec debug=true : `query` (la requête
# envoyée à Elasticsearch seulement) ou `all` (toutes les lignes de la recherche).
debug_search_scope = query
# Éléments d'une liste `terms` montrés dans la requête affichée en debug
# (journal, warning, page Query) ; la suite est résumée « [...] et X de plus ».
debug_terms_max = 100
# ES|QL (esql=, 1.22.0) : bornes de la requête, contrôlées avant tout envoi
# (ajouts de l'app compris). Mesuré sur un tas de 512 Mo : une requête ES|QL a
# arrêté un nœud dès 10 Ko ; ES|QL refuse lui-même au-delà d'une profondeur
# d'expression de 400 (≈ 198 parenthèses). Taille : 1024 à 1000000 ; imbrication : 1 à 400.
esql_max_bytes = 65536
esql_max_depth = 100
# Colonne `X.keyword` masquée quand la colonne `X` est rendue (même valeur, en
# double ; comme Discover de Kibana par défaut). Surchargeable par profil.
esql_hide_keyword = true
# Valeurs (exactes ou à joker) d'un lookup INSÉRÉ dans une requête ES|QL
# (lookup_stage=result, marqueur $lookup$ après EVAL/STATS) : au-delà, refus
# explicite. 10 000 valeurs ont arrêté un nœud sous charge. 1 à 65536.
esql_lookup_values_max = 1000
# Profils en mode ES|QL asynchrone (esql_mode = async, Elasticsearch 8.13+) :
# attente de chaque interrogation, conservation du résultat côté Elasticsearch
# (une requête interrompue sans annulation expire au bout de ce délai), et durée
# maximale d'une requête, en secondes (au-delà, elle est annulée ; 10 à 86400).
esql_async_wait = 10s
esql_async_keep_alive = 5m
esql_async_max = 1800

# ---- Exemple de profil (à copier dans local/esearch.conf) ----
# [profile:prod]
# es_host = https://es.example.com:9200
# verify_certs = true
# ca_file = /opt/splunk/etc/apps/SA-esearch/auth/ca.pem
# timefield = @timestamp
# auth_type = apikey            # none | basic | apikey
# # si basic : username = svc_splunk
# max_limit = 50000
#
# Secret associé (jamais dans un .conf !) — à créer une fois :
#   curl -k -u admin https://localhost:8089/servicesNS/nobody/SA-esearch/storage/passwords \
#        -d name=apikey -d realm=esearch:prod -d password='<LA_CLE>'
#   (auth_type=basic : name=<username> à la place d'apikey)

# Pagination des gros volumes (limit > 10000) : auto | pit | scroll
# auto = PIT+search_after (recommandé), repli scroll si indisponible.
# (surchageable par profil)
# pagination = auto

# mTLS (authentification par certificat client), par profil :
# client_cert = /opt/splunk/etc/apps/SA-esearch/auth/client.pem
# client_key  = /opt/splunk/etc/apps/SA-esearch/auth/client.key
