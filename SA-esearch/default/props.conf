# Journal de l'app (esearch.log, écrit dans $SPLUNK_HOME/var/log/splunk et
# indexé dans _internal par la surveillance par défaut de Splunk). Sans cette
# déclaration, Splunk apprenait un sourcetype au hasard du contenu : trois
# successifs constatés (esearch-too_small, esearch-2, esearch-3).
#
# Trois sourcetypes, une segmentation sans priorité (règles disjointes) :
#   esearch:log               lignes ordinaires (INFO, WARNING, ERROR)
#   esearch:log:debug         lignes DEBUG du niveau global (log_level = DEBUG)
#   esearch:log:debug_search  lignes d'une recherche lancée avec debug=true,
#                             reconnues à leur marqueur [debug sid=…]
[source::.../var/log/splunk/esearch.log*]
sourcetype = esearch:log

[esearch:log]
SHOULD_LINEMERGE = false
# Une ligne = un événement : l'app neutralise tout saut de ligne (\x0a).
LINE_BREAKER = ([\r\n]+)\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} \[
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
# La ligne de la requête envoyée en debug peut dépasser les 10 000 octets par
# défaut de Splunk (requête Lucene bornée à 10 000 caractères + listes terms).
TRUNCATE = 100000
TRANSFORMS-esearch_segmentation = esearch_log_debug, esearch_log_debug_search
EXTRACT-esearch_entete = ^\S+ \S+ \[(?<niveau>[A-Z]+)\] \[pid=(?<pid>\d+)\](?: \[debug(?: sid=(?<debug_sid>[^\s\]]+))?(?: debug_tag=(?<debug_tag>[^\]\s]+))?\])? (?<composant>[a-z]+):

[esearch:log:debug]
EXTRACT-esearch_entete = ^\S+ \S+ \[(?<niveau>[A-Z]+)\] \[pid=(?<pid>\d+)\](?: \[debug(?: sid=(?<debug_sid>[^\s\]]+))?(?: debug_tag=(?<debug_tag>[^\]\s]+))?\])? (?<composant>[a-z]+):

[esearch:log:debug_search]
EXTRACT-esearch_entete = ^\S+ \S+ \[(?<niveau>[A-Z]+)\] \[pid=(?<pid>\d+)\](?: \[debug(?: sid=(?<debug_sid>[^\s\]]+))?(?: debug_tag=(?<debug_tag>[^\]\s]+))?\])? (?<composant>[a-z]+):
