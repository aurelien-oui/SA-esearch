# Capability qui autorise l'usage d'esearch (et l'appel du proxy REST privilégié
# pour les profils authentifiés). Elle NE donne PAS accès aux secrets.
[capability::esearch_run]

# Par défaut, accordée au rôle "user" -> tous les utilisateurs (et admin, qui
# importe "user") peuvent interroger Elasticsearch depuis n'importe quelle app,
# y compris les correlation searches de Splunk ES. Le secret reste lu côté
# serveur en système, jamais exposé aux utilisateurs.
#
# POUR RESTREINDRE : retirer cette ligne (dans local/authorize.conf) et
# n'affecter le rôle esearch_user (ci-dessous) qu'aux utilisateurs autorisés.
# Voir OPERATIONS.md §"Accès global / restreindre".
[role_user]
esearch_run = enabled

# Accordée aussi DIRECTEMENT à admin. Sans cette ligne, admin ne la tenait que
# par héritage de « user » : la procédure de restriction (retirer esearch_run à
# user) privait donc les administrateurs des profils authentifiés (vérifié,
# 1.12.0).
[role_admin]
esearch_run = enabled

# Rôle dédié prêt à l'emploi (pour un déploiement restreint).
[role_esearch_user]
importRoles = user
esearch_run = enabled
