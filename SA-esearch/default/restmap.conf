# Endpoint privilégié du proxy esearch : exécute les profils authentifiés
# (basic/apikey) côté serveur avec le jeton système, sans exposer le secret.
[script:esearch_proxy]
match                 = /esearch_proxy
script                = esearch_proxy.py
scripttype            = persist
handler               = esearch_proxy.ESearchProxy
passSystemAuth        = true
# Requiert la capability esearch_run pour appeler l'endpoint (donnée aux rôles
# autorisés à interroger Elasticsearch). Ne donne PAS accès aux secrets.
#
# `capability` et NON `capability.post` : `capability.<méthode>` ne contraint
# que cette méthode. Avec `capability.post`, un PUT atteignait le handler sans
# aucune capability et renvoyait les documents lus avec le secret du profil —
# démontré avec un utilisateur dépourvu d'esearch_run (POST 403,
# PUT 200 + documents). GET et DELETE atteignaient le handler eux aussi.
capability            = esearch_run
python.version        = python3
python.required        = 3.9,3.13
output_modes          = json
